spring:
  application:
    name: smstxnlab
  datasource:
    url: ${SMSLAB_DB_URL:jdbc:h2:mem:smstxnlab;DB_CLOSE_DELAY=-1}
    username: ${SMSLAB_DB_USER:sa}
    password: ${SMSLAB_DB_PASSWORD:}
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
server:
  address: ${SMSLAB_BIND_ADDRESS:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info
smstxnlab:
  gateway-secret: ${SMSLAB_GATEWAY_SECRET:}
  operator-key: ${SMSLAB_OPERATOR_KEY:}
  pending-minutes: 10
